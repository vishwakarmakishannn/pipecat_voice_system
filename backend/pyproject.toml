[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-mswipe-backend"
version = "0.1.0"
description = "Pipecat Mswipe Voice Agent Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pipecat-ai[cartesia,daily,deepgram,openai,google,kokoro,silero,runner,webrtc,piper]>=1.5,<1.6",
    "fastapi",
    "httpx",
    "uvicorn",
    "python-dotenv",
    "loguru",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "pgvector",
    "aioboto3",
    "aiofiles",
    "pyjwt",
    "bcrypt",
    "passlib[bcrypt]",
    "sentence-transformers",
    # Direct declarations let uv route transitive ML requirements to CPU-only
    # wheels; this service does not use CUDA at runtime.
    "torch",
    "torchvision",
    "python-multipart",
    "tavily-python",
    "pydantic",
    "pywhispercpp>=1.5,<2",
    "mlx-whisper>=0.4.3,<0.5",
    "moonshine-voice>=0.1.5,<0.2"
]

[project.optional-dependencies]
knowledge-worker = [
    "beautifulsoup4",
    "docling",
    "crawl4ai",
    "trafilatura",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = [
    "api",
    "core",
    "providers",
    "services",
    "tools"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "."
]
markers = [
  "database: requires a migrated PostgreSQL + pgvector integration database",
]
