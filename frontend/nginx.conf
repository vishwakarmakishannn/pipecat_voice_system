upstream voice_backend {
    server backend:7860;
    keepalive 32;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    tcp_nodelay on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript application/json application/wasm image/svg+xml text/css text/plain;

    # All REST APIs and SmallWebRTC signaling share the frontend origin. Keep
    # upstream sockets warm and disable proxy buffering for signaling responses.
    location ~ ^/(api|sessions|files|start|status|health|ready|docs|openapi\.json)(/|$) {
        proxy_pass http://voice_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
